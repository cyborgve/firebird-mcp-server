name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
  - type: textarea
    id: feature_description
    attributes:
      label: Description of the feature
      description: A clear and concise description of what you want to achieve.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case / Motivation
      description: Why is this feature needed? How does it improve the MCP Server?
    validations:
      required: true
